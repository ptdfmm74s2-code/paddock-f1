<!--
  Paddock F1 — manager (mur des stands) ou pilote, saison complète 2026.
  Tracés des circuits : bacinger/f1-circuits (licence MIT, © Tomislav Bacinger).
  Jeu de fan non officiel : aucun lien avec la Formula 1, la FIA ou les écuries.
-->
<style>
:root {
  --bg: #07090D; --panel: #10141B; --panel-2: #171C25; --panel-3: #1F2632; --line: #2A3342;
  --ink: #EEF2F8; --muted: #8C97AA; --red: #E10600; --red-2: #FF2A1F; --ok: #2BD67B; --warn: #FFB020; --purple: #B25BFF;
  --team: #E10600; --team-ink: #fff;
  --f: "Titillium Web", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.4 var(--f); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red-2); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { margin: 0; line-height: 1.1; text-wrap: balance; }

#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; display: block; }
.screen { position: fixed; inset: 0; z-index: 1; display: none; overflow: auto; background: var(--bg); }
.screen.on { display: block; }
.screen.race { background: transparent; overflow: hidden; }

/* ---------- Boutons & éléments communs ---------- */
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 10px; padding: 10px 16px; font-weight: 700; letter-spacing: .02em; transition: background .15s, transform .1s; }
.btn:hover { background: var(--panel-3); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.primary:hover { background: var(--red-2); }
.btn.team { background: var(--team); border-color: var(--team); color: var(--team-ink); }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.btn.big { padding: 14px 22px; font-size: 17px; }
.btn[disabled] { opacity: .45; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--panel-3); font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.tyre { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--c); background: #111; color: var(--c); font-size: 10px; font-weight: 900; line-height: 1; flex: none; }
.tyre.lg { width: 34px; height: 34px; border-width: 5px; font-size: 14px; }
.tbar { display: inline-block; width: 4px; height: 16px; border-radius: 2px; background: var(--c); flex: none; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 7px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--panel-3); color: var(--ink); box-shadow: inset 0 -2px 0 var(--red); }
.muted { color: var(--muted); }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

/* ---------- Écrans menus ---------- */
.wrap { max-width: 1100px; margin: 0 auto; padding: max(18px, env(safe-area-inset-top)) 16px 60px; }
.hero { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; background:
  radial-gradient(1200px 500px at 70% -10%, rgba(225, 6, 0, .28), transparent 60%),
  repeating-linear-gradient(115deg, transparent 0 38px, rgba(255, 255, 255, .025) 38px 40px), var(--bg); }
.hero-in { width: min(560px, 100%); display: grid; gap: 18px; }
.logo { font-size: clamp(52px, 13vw, 96px); font-weight: 900; font-style: italic; letter-spacing: -.02em; line-height: .9; }
.logo span { color: var(--red); }
.hero p { margin: 0; color: var(--muted); font-size: 17px; }
.hero .btn { width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; }
.hero .note { font-size: 12.5px; color: var(--muted); }
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.topbar h2 { font-size: 26px; font-weight: 900; font-style: italic; flex: 1; min-width: 200px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.rolecards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.rolecard { text-align: left; border: 2px solid var(--line); background: var(--panel); border-radius: 14px; padding: 16px; display: grid; gap: 6px; }
.rolecard.on { border-color: var(--red); background: linear-gradient(160deg, rgba(225, 6, 0, .16), var(--panel) 60%); }
.rolecard b { font-size: 20px; font-weight: 900; }
.rolecard span { color: var(--muted); font-size: 14px; }
.teamgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.teamcard { text-align: left; border: 2px solid var(--line); border-radius: 12px; padding: 12px; background: linear-gradient(135deg, color-mix(in srgb, var(--c) 30%, transparent), var(--panel) 70%); display: grid; gap: 4px; position: relative; overflow: hidden; }
.teamcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.teamcard.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.teamcard b { font-size: 17px; font-weight: 900; }
.teamcard small { color: var(--muted); font-size: 12.5px; line-height: 1.3; }
.drvpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.section { display: grid; gap: 10px; margin-bottom: 22px; }
.section h3 { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.opts { display: grid; gap: 12px; }
.opt { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
.opt label { font-weight: 700; }
.gpgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.gpbtn { text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 10px; display: grid; gap: 2px; }
.gpbtn.on { border-color: var(--red); background: var(--panel-3); }
.gpbtn b { font-size: 14px; }
.gpbtn small { color: var(--muted); font-size: 12px; }
.stickybar { position: sticky; bottom: 0; padding: 12px 0 max(12px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); display: flex; gap: 10px; justify-content: flex-end; }

/* Hub */
.nextgp { display: grid; grid-template-columns: 1fr 220px; gap: 16px; align-items: center; background: linear-gradient(120deg, color-mix(in srgb, var(--team) 26%, var(--panel)), var(--panel) 65%); }
.nextgp h3 { font-size: 30px; font-weight: 900; font-style: italic; }
.nextgp canvas { width: 100%; height: 160px; }
@media (max-width: 640px) { .nextgp { grid-template-columns: 1fr; } }
table.std { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.std td, table.std th { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.std th { font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
table.std tr.me td { background: color-mix(in srgb, var(--team) 18%, transparent); }
table.std td.r, table.std th.r { text-align: right; }
.cal { display: grid; gap: 4px; max-height: 420px; overflow: auto; }

/* ---------- Mur des stands (manager) ---------- */

.chequer { background: repeating-conic-gradient(#fff 0 25%, #000 0 50%) 0 0 / 24px 24px; -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 1px rgba(255, 255, 255, .5); }

  },
  ask(car) {
    const q = makeQuestion(car, this.race); if (!q) return;
    car.ask = { ...q, at: Date.now() };
    this.drv(car, q.text, { ask: { text: q.text, opts: q.opts.map(o => ({ l: o.l, say: o.say })) } });
  },
  gaps(c) {
    const o = this.race.order, i = o.indexOf(c), a = o[i - 1], b = o[i + 1];
    return { a, b, ga: a && !a.dnf ? c.gap - a.gap : null, gb: b && !b.dnf ? b.gap - c.gap : null };
  },
  lapsToBox(c) { const r = this.race, rate = r.wearPerLap(c); return Math.max(0, Math.round((c.wTh - c.wear) / Math.max(rate, .1))); },
  tyreFeel(c) {
    const w = c.wear;
    if (isWetTyre(c.comp) && this.race.w < .15) return 'Les ' + PL[c.comp] + ' surchauffent, la piste est sèche !';
    if (!isWetTyre(c.comp) && this.race.w > .3) return 'Aucune adhérence avec ces slicks, c\'est une patinoire !';
    if (w < 25) return 'Les pneus sont top, beaucoup de grip.';
    if (w < 50) return 'Ça va, un peu de dégradation à l\'arrière.';
    if (w < 70) return 'Ils commencent à tomber, l\'arrière glisse en sortie de virage.';
    return 'Ils sont morts, je n\'ai plus d\'adhérence du tout !';
  },
  // ---------- MANAGER → PILOTE ----------
  managerSays(text, car) { Radio.push({ who: 'me', car, text }); this.handleManager(text, car); },
  handleManager(text, car) {
    const t = norm(text);
    const ask = car.ask && Date.now() - car.ask.at < 60000 ? car.ask : null;
    if (ask) { const k = yesNo(t, ask); if (k >= 0 && (!AI.ok() || ask.opts[k].kw)) return this.answerAsk(car, k); }
    if (AI.ok() && !car.dnf && !car.fin && t.trim().length > 1) {
      AI.driver(car, text, ask).then(res => { if (!res) return this.ruleManager(text, car); car.ask = null; this.applyActs(car, res); this.drv(car, res.reply); });
      return;
    }
    this.ruleManager(text, car);
  },
  // le pilote humain reçoit un ordre de l'ingénieur humain (multijoueur) : on applique les ordres de stand
  humanOrder(text, car) {
    const t = norm(text), comp = parseComp(t);
    if (RX.cancel.test(t)) { car.pitReq = false; car.pitComp = null; return; }
    if (RX.box.test(t) && !/\b(quand|est ce que|tu veux|tu crois|tu penses|dois|faut|on devrait)\b|\?/.test(t) && !car.pit) { car.pitReq = true; car.pitComp = comp || car.pitComp || this.race.autoComp(car); return; }
    if (comp) car.pitComp = comp;
  },
  ruleManager(text, car) {
    const r = this.race, t = norm(text);
    const reply = (s, d = 1.3) => this.later(() => this.drv(car, s), d);
    if (car.dnf) return reply(pick(['Je suis à l\'arrêt, désolé les gars…', 'C\'est fini pour moi aujourd\'hui.']));
    if (car.fin) return reply(pick(['Merci pour tout le travail, l\'équipe !', 'Bonne course. On fera mieux la prochaine fois.', 'Merci, merci beaucoup !']));
    const mate = r.cars.find(x => x.team === car.team && x !== car);
    const comp = parseComp(t);
    if (RX.cancel.test(t)) { const had = car.pitReq; car.pitReq = false; car.pitComp = null; return reply(had ? 'Compris, je reste en piste.' : 'Ok, je reste dehors.'); }
    if (RX.box.test(t) && !/\b(quand|est ce que|tu veux|tu crois|tu penses|dois|faut|on devrait)\b|\?/.test(t)) {
      if (car.pit) return reply('Je suis déjà dans les stands !');
      car.pitReq = true; car.pitComp = comp || car.pitComp || r.autoComp(car);
      const dryT = r.w < .2, wetC = isWetTyre(car.pitComp);
      return reply(wetC && dryT ? `Des ${PL[car.pitComp]} ? La piste est sèche… bon, d'accord, box.` : !wetC && r.w > .4 ? `Des slicks sous la pluie ?! Ok… box box.` : pick([`Box box, compris. On passe en ${PL[car.pitComp]}.`, `Copy, box ce tour, ${PL[car.pitComp]}.`, `Reçu, je rentre. ${PL[car.pitComp][0].toUpperCase() + PL[car.pitComp].slice(1)}.`]));
    }
    if (comp) { car.pitComp = comp; return reply(`Ok, ${PL[comp]} au prochain arrêt.`); }
    if (RX.letPass.test(t)) {
      if (!mate || mate.dnf) return reply('Mon coéquipier n\'est plus en course…');
      if (mate.pos < car.pos) return reply('Il est déjà devant moi !');
      car.letPass = 8; mate.hold = false;
      return reply(pick(['… Sérieusement ? Bon. Compris, je le laisse passer.', 'Ok, ok. Je le laisse passer au prochain virage.', 'C\'est pas juste, mais compris.']));
    }
    if (RX.hold.test(t)) { car.hold = true; if (mate) mate.hold = true; return reply('Compris, je garde ma position.'); }
    if (RX.free.test(t)) { car.hold = false; if (mate) mate.hold = false; return reply('Super, merci ! On va s\'amuser.'); }
    if (RX.save.test(t)) { car.mode = 'save'; car.paceT = 0; return reply(pick(['Compris, je gère les pneus.', 'Ok, mode économie.', 'Reçu, je lève le pied.'])); }
    if (RX.defend.test(t)) { car.mode = 'defend'; car.paceT = 0; return reply(pick(['Compris, je ferme la porte.', 'Ok, je défends. Il ne passera pas.'])); }
    if (RX.push.test(t)) { car.mode = 'push'; car.paceT = 0; return reply(pick(['C\'est parti, je pousse !', 'Ok, mode attaque. On y va !', 'Compris, je donne tout.', 'Enfin ! Je pousse.'])); }
    if (RX.normal.test(t)) { car.mode = 'normal'; car.paceT = 0; return reply('Compris, rythme normal.'); }
    const ans = Talk.driver(car, t);
    if (ans) return reply(ans);
    if (t.trim().length < 3) return;
    reply(pick(['Reçu.', 'Compris.', 'Copy, compris.', 'Bien reçu.', 'Je n\'ai pas bien compris, tu peux répéter ?']));
  },
  // ---------- PILOTE (joueur) → INGÉNIEUR ----------
  pilotSays(text) {
    const r = this.race, c = r.cars.find(x => x.isPlayer);
    Radio.push({ who: 'me', car: c, text, speak: false });
    if (Game.multi) return; // l'ingénieur humain entend et lit le message
    if (AI.ok() && !c.fin) { AI.engineer(c, text).then(res => { if (!res) return this.rulePilot(text, c); this.applyActs(c, res); this.eng(c, res.reply); }); return; }
    this.rulePilot(text, c);
  },
  rulePilot(text, c) {
    const r = this.race, t = norm(text);
    const reply = (s, d = 1.2) => this.later(() => this.eng(c, s), d);
    const comp = parseComp(t);
    if (c.fin) return reply(pick(['Merci à toi, superbe travail aujourd\'hui.', 'Bien joué, rentre tranquillement aux stands.']));
    if (RX.cancel.test(t)) { c.pitReq = false; c.pitComp = null; return reply('Compris, on reste dehors. Pas de box.'); }
    if (RX.strat.test(t) || (/\b(quand|dois|faut|est ce que|tu crois|on devrait|c est le moment)\b|\?/.test(t) && RX.box.test(t))) {
      return reply(Talk.pitWindow(c));
      const n = this.lapsToBox(c), left = r.laps - c.lapsDone;
      if (idealFor(r.w) && !isWetTyre(c.comp)) return reply('Il faut rentrer dès que possible pour des ' + PL[idealFor(r.w)] + '.');
      if (n >= left) return reply(`On peut aller jusqu'au bout sur ces ${PL[c.comp]}${r.twoComp && new Set([...c.used].filter(x => !isWetTyre(x))).size < 2 ? ', mais il faudra quand même faire l\'arrêt obligatoire' : ''}.`);
      return reply(`Fenêtre d'arrêt dans ${n} tour${n > 1 ? 's' : ''}, plan : ${PL[r.autoComp(c)]}.`);
    }
    if (RX.box.test(t)) {
      if (c.pit || c.autoPit) return reply('Tu es déjà dans la voie des stands.');
      c.pitReq = true; c.pitComp = comp || r.autoComp(c);
      return reply(`Compris, box box ce tour. On met des ${PL[c.pitComp]}.`);
    }
    if (comp) { c.pitComp = comp; return reply(`Noté, ${PL[comp]} au prochain arrêt.`); }
    const ans = Talk.engineer(c, t);
    if (ans) reply(ans);
  },
  // ---------- MESSAGES SPONTANÉS ----------
  handle(ev) {
    const r = this.race, c = ev.c, pilot = this.role === 'pilot';
    const me = pilot ? r.cars.find(x => x.isPlayer) : null, P = x => pilot && x && x.isPlayer;
    switch (ev.k) {
      case 'go':
        if (pilot) this.eng(me, pick(['Feux éteints, c\'est parti ! Bonne course.', 'Allez, allez, allez ! Bon départ.']));
        else this.later(() => this.drv(r.cars.find(x => x.team === r.myTeam), pick(['Bon départ !', 'C\'est parti, on y va.'])), 6);
        break;
      case 'lap': {
        if (r.session === 'quali') { if (c.isPlayer) this.eng(c, ev.valid ? `${frNum(ev.t, 3)}. ${ev.t <= c.bestLap ? 'Meilleur tour !' : ''}` : 'Tour invalidé.', { q: 1 }); break; }
        if (!this.mine(c) || c.fin) break;
        const left = r.laps - c.lapsDone;
        if (P(c)) {
          if (left === 1) this.eng(c, 'Dernier tour ! Ramène-la à la maison.');
          else if (c.lapsDone % 4 === 2) { const g = this.gaps(c); if (g.a && g.ga != null) this.eng(c, `P${c.pos}. Écart devant ${frNum(g.ga)} sur ${g.a.drv.last}.` + (g.b && g.gb != null && g.gb < 1.5 ? ` ${g.b.drv.last} à ${frNum(g.gb)} derrière.` : '')); }
        } else if (left === Math.floor(r.laps * .4) && r.twoComp && c.stops === 0 && !c.pitReq && this.once(c, 'mand')) this.drv(c, 'On doit encore faire notre arrêt obligatoire, non ?');
        break;
      }
      case 'pitstop':
        if (this.mine(c)) {
          if (ev.slow) P(c) ? this.eng(c, 'Désolé, problème avec une roue… Allez, on se reconcentre.') : this.drv(c, 'Qu\'est-ce qui s\'est passé ?! On a perdu un temps fou !');
          else if (P(c)) this.eng(c, `Bon arrêt, ${frNum(ev.dur, 1)} secondes. ${PL[c.comp][0].toUpperCase() + PL[c.comp].slice(1)}, allez, on attaque.`);
          else if (Math.random() < .5) this.drv(c, pick(['Bon arrêt les gars !', 'Super arrêt, merci !']));
        }
        break;
      case 'autopit': this.eng(c, 'Limiteur activé, on t\'attend.', { q: 1 }); break;
      case 'gain':
        if (this.mine(c) && this.can('gain' + c.code, 20)) P(c) ? this.eng(c, pick([`Bien joué ! P${ev.pos}.`, `Superbe dépassement ! Tu es P${ev.pos}.`])) : this.drv(c, pick(['Yes ! Je l\'ai passé !', 'Et voilà, dépassé !', `P${ev.pos} !`]));
        else if (this.mine(ev.o) && this.can('lose' + ev.o.code, 25)) P(ev.o) ? this.eng(ev.o, pick([`${c.drv.last} est passé. P${ev.o.pos + 1}, on se bat.`, 'Pas grave, reste concentré.'])) : this.drv(ev.o, pick(['Il m\'a passé, je n\'avais plus de batterie.', `${c.drv.last} est trop rapide dans la ligne droite.`, 'Mince ! Je n\'ai pas pu résister.']));
        break;
      case 'fastest': if (this.mine(c) && r.session === 'race' && c.lapsDone > 1 && this.can('fl', 30)) P(c) ? this.eng(c, 'Meilleur tour en course, violet !') : this.drv(c, 'C\'est un bon tour ça, non ?'); break;
      case 'dnf':
        if (this.mine(c)) this.drv(c, pick(['Non ! J\'ai perdu la puissance… je dois m\'arrêter.', 'Moteur ! Le moteur est cassé…', 'Problème de freins, je dois abandonner. Désolé.']));
        else if (this.can('odnf', 20)) this.drv(c, pick(['Non, non, non ! Plus de puissance !', 'Je m\'arrête, il y a de la fumée.']), { who: 'other' });
        break;
      case 'rain': {
        const v = 1 + Math.floor(Math.random() * 14);
        const mc = pilot ? me : r.cars.find(x => x.team === r.myTeam && !x.dnf);
        if (mc) pilot ? this.eng(mc, `Attention, la pluie arrive. Virage ${v} glissant.`) : this.drv(mc, `Il commence à pleuvoir au virage ${v} !`);
        break;
      }
      case 'dry': { const mc = pilot ? me : r.cars.find(x => x.team === r.myTeam && !x.dnf); if (mc) pilot ? this.eng(mc, 'La pluie s\'arrête, la piste va sécher.') : this.drv(mc, 'Il ne pleut plus, la trajectoire sèche vite.'); break; }
      case 'selfpit': this.drv(c, ev.why === 'wear' ? 'Les pneus sont morts, je rentre ! Je ne peux plus continuer.' : 'Impossible de rester en piste, je rentre pour changer de pneus !'); break;
      case 'finish':
        if (this.mine(c)) {
          const p = c.pos, txt = p === 1 ? 'OUIII ! On a gagné ! Merci l\'équipe, merci à tous !' : p <= 3 ? `Le podium ! P${p}, super boulot à tous !` : p <= 10 ? `P${p}, on prend des points. Bon travail.` : `P${p}… Pas de points aujourd'hui, on va travailler.`;
          if (P(c)) this.eng(c, p === 1 ? 'Victoire ! Tu as gagné ! Incroyable, merci, merci !' : p <= 3 ? `P${p} ! Le podium ! Superbe course !` : p <= 10 ? `P${p}, des points pour l'équipe. Bon boulot.` : `Drapeau à damier, P${p}. On analysera tout ça.`);
          else this.drv(c, txt);
        }
        break;
      case 'crash': if (c.isPlayer && this.can('crash', 12)) this.eng(c, ev.impact > 20 ? 'Ouch ! Tout va bien ? Tu peux continuer ?' : 'Attention aux murs !'); break;
      case 'contact': if (c.isPlayer && this.can('contact', 15)) this.eng(c, `Contact avec ${ev.o.drv.last}. Attention.`); break;
      case 'invalid': this.eng(c, 'Tour invalidé, limites de piste.', { q: 1 }); break;
    }
  },
  // appelé chaque seconde de simulation
  tick() {
    const r = this.race, pilot = this.role === 'pilot';
    if (r.phase !== 'race' || r.session !== 'race' || r.done) return;
    for (const c of r.cars) {
      if (!this.mine(c) || c.dnf || c.fin) continue;
      const left = r.laps - c.lapsDone;
      if (pilot && c.isPlayer) {
        if (!Game.multi && !c.pitReq && !c.pit && left > 1 && c.lapsDone >= 1) {
          const ideal = idealFor(r.w);
          const usedDry = new Set([...c.used].filter(x => !isWetTyre(x)));
          let why = null;
          if (ideal && !isWetTyre(c.comp) && r.w > .3) why = ideal;
          else if (!ideal && isWetTyre(c.comp) && r.w < .12) why = r.autoComp(c);
          else if (!ideal && c.wear > c.wTh && left > 2) why = r.autoComp(c);
          else if (!ideal && r.twoComp && usedDry.size < 2 && [...c.used].every(x => !isWetTyre(x)) && left <= 3) why = r.autoComp(c);
          if (why && this.once(c, 'box' + Math.floor(r.w * 3))) { c.pitReq = true; c.pitComp = why; this.eng(c, `Box box, box box. On passe en ${PL[why]}. Dis « annule » pour rester dehors.`); }
        }
      } else {
        if (c.wear > 55 && this.once(c, 'w55')) this.drv(c, 'Les pneus commencent à baisser.');
        if (c.wear > 72 && this.once(c, 'w72')) this.drv(c, 'Je n\'ai presque plus de grip. On rentre bientôt ?');
        if (c.blockT > 6 && this.can('blk' + c.code, 45)) { const g = this.gaps(c); if (g.a) this.drv(c, g.a.team === c.team ? `Je suis plus rapide que ${g.a.drv.last}, on fait quoi ?` : `Je suis bloqué derrière ${g.a.drv.last} !`); }
        if (!isWetTyre(c.comp) && r.w > .35 && this.can('wet' + c.code, 30)) this.drv(c, 'Je n\'ai aucune adhérence avec ces slicks, il faut des intermédiaires !');
        if (isWetTyre(c.comp) && r.w < .12 && this.can('dryt' + c.code, 30)) this.drv(c, 'La piste est sèche, mes ' + PL[c.comp] + ' sont en train de fondre !');
        // questions de stratégie (au plus une toutes les ~50 s réelles par pilote)
        if (c.ask && Date.now() - c.ask.at > 45000) c.ask = null;
        const nowR = Date.now();
        if (!c.ask && c.lapsDone >= 1 && left > 1 && nowR - (c.lastAsk || 0) > 50000 && nowR - (this.lastAskAny || 0) > 20000 && Radio.q.length < 2 && Math.random() < .25) { c.lastAsk = this.lastAskAny = nowR; this.ask(c); }
      }
    }
    // radio des autres écuries (comme à la télé)
    if (r.order[0].lapsDone >= 2) this.nextOther -= 1;
    if (this.nextOther <= 0) {
      this.nextOther = rand(40, 75);
      const pool = r.order.filter(c => !c.dnf && !c.fin && c.team !== r.myTeam);
      if (pool.length && Radio.q.length === 0) {
        const c = pick(pool.slice(0, 14));
        Radio.push({ who: 'other', car: c, text: pick(OTHER_LINES) });
        if (Math.random() < .5) Radio.push({ who: 'eng', car: c, text: pick(OTHER_ENG), speak: Radio.prefs.others });
      }
    }
  },
};

/* =====================================================================
   CONVERSATION RADIO — compréhension élargie et réponses chiffrées
   Talk.engineer(c, t) : l'ingénieur répond au pilote
   Talk.driver(c, t)   : le pilote répond à l'ingénieur
   (t = texte normalisé : minuscules, sans accents)
   ===================================================================== */
const CORNERS = ['avant gauche', 'avant droit', 'arrière gauche', 'arrière droit'];
const WEARF = [1.04, 1.1, .96, 1.0];
const Talk = {
  last: { eng: '', drv: '' },
  // corrige quelques erreurs fréquentes de la dictée vocale
  fix(t) {
    return ' ' + t.replace(/\b(boxe|bocs|boks|bock|books|backs)\b/g, 'box').replace(/\bpneu\b/g, 'pneus').replace(/\bet car\b/g, 'ecart').replace(/\bmedium\b/g, 'mediums')
      .replace(/\bstand\b/g, 'stands').replace(/\bp ?(\d+)\b/g, 'p$1').replace(/[?!.,;:\-]/g, ' ').replace(/\s+/g, ' ') + ' ';
  },
  r: a => a[Math.floor(Math.random() * a.length)],
  f1: x => frNum(Math.max(0, x), 1),
  s(x) { return x >= 2 ? 's' : ''; },
  carNamed(t, self) {
    const r = Brain.race, flat = t.replace(/\s/g, '');
    let best = null;
    for (const c of r.cars) {
      if (c === self) continue;
      const ln = norm(c.drv.last).replace(/\s/g, ''), fn = norm(c.drv.first).replace(/\s/g, '');
      if (flat.includes(ln) || (fn.length > 3 && new RegExp('\\b' + fn + '\\b').test(t)) || new RegExp('\\b' + c.code.toLowerCase() + '\\b').test(t)) best = c;
    }
    if (!best) for (const tm of TEAMS) if (t.includes(norm(tm.name))) { const cs = r.cars.filter(c => c.team === tm && c !== self); if (cs.length) best = cs.sort((a, b) => a.pos - b.pos)[0]; }
    return best;
  },
  gapTo(c, o) {
    const L = Brain.race.T.L;
    const laps = Math.trunc((o.dist - c.dist) / L);
    if (Math.abs(laps) >= 1) return { lapped: laps, txt: Math.abs(laps) + ' tour' + (Math.abs(laps) > 1 ? 's' : '') };
    return { s: o.gap - c.gap, txt: this.f1(Math.abs(o.gap - c.gap)) + ' seconde' + this.s(Math.abs(o.gap - c.gap)) };
  },
  worstCorner(c) { let k = 0; for (let q = 1; q < 4; q++) if (c.temps[q] > c.temps[k]) k = q; return k; },
  mostWorn(c) { let k = 0; for (let q = 1; q < 4; q++) if (WEARF[q] > WEARF[k]) k = q; return k; },
  tyreState(w) { return w < 20 ? 'comme neufs' : w < 40 ? 'en bon état' : w < 60 ? 'en train de se dégrader' : w < 75 ? 'bien usés' : 'en fin de vie'; },
  forecast() {
    const r = Brain.race, lp = Math.max(0, r.order[0].dist / r.T.L), seg = r.weather.segs.find(s => s.to > lp);
    if (r.rain > 0) { const end = seg ? Math.max(1, Math.round(seg.to - lp)) : null; return `Il pleut${r.w > .6 ? ' fort' : ''}, piste mouillée à ${Math.round(r.w * 100)} %.${end ? ` L'averse devrait durer encore ${end} tour${end > 1 ? 's' : ''}.` : ''}`; }
    if (seg && seg.from > lp) { const k = Math.max(1, Math.round(seg.from - lp)); return `Pas de pluie pour l'instant, mais le radar annonce une averse dans environ ${k} tour${k > 1 ? 's' : ''}${seg.r > .7 ? ', et elle s\'annonce forte' : ''}.`; }
    if (r.w > .05) return `Il ne pleut plus, la piste sèche : encore ${Math.round(r.w * 100)} % d'humidité.`;
    return this.r(['Temps sec, aucune pluie annoncée.', 'Rien au radar, ciel dégagé jusqu\'à la fin.', 'Piste sèche, pas de pluie prévue.']);
  },
  standings() {
    const s = Game.save; if (!s || Game.wk.quick) return null;
    const st = standings(s), me = Brain.race.cars.find(c => c.isPlayer) || Brain.race.cars.find(c => c.team === Brain.race.myTeam);
    const i = st.d.findIndex(x => x.d === me.drv), lead = st.d[0];
    return i === 0 ? `Tu es en tête du championnat avec ${lead.p} points.` : `Au championnat, tu es P${i + 1} avec ${st.d[i].p} points. ${lead.d.last} mène avec ${lead.p}.`;
  },
  pitWindow(c) {
    const r = Brain.race, left = r.laps - c.lapsDone, n = Brain.lapsToBox(c), ideal = idealFor(r.w);
    if (c.pitReq) return `On t'attend aux stands ce tour pour des ${PL[c.pitComp || r.autoComp(c)]}.`;
    if (ideal && !isWetTyre(c.comp)) return `Il faut rentrer dès que possible pour des ${PL[ideal]}.`;
    if (!ideal && isWetTyre(c.comp) && r.w < .15) return `La piste sèche : on repasse en slicks bientôt, sans doute des ${PL[r.autoComp(c)]}.`;
    const mand = r.twoComp && new Set([...c.used].filter(x => !isWetTyre(x))).size < 2 && [...c.used].every(x => !isWetTyre(x));
    if (n >= left) return `Ces ${PL[c.comp]} peuvent aller jusqu'au bout${mand ? ', mais il reste l\'arrêt obligatoire à faire : on le placera en fin de course' : ''}.`;
    if (n <= 0) return `C'est le moment de rentrer : box ce tour ou au prochain, pour des ${PL[c.pitComp || r.autoComp(c)]}.`;
    return `Fenêtre d'arrêt dans ${n} tour${n > 1 ? 's' : ''}. Plan : des ${PL[c.pitComp || r.autoComp(c)]}${left - n > 0 ? ` pour les ${left - n} derniers tours` : ''}.`;
  },
  pace(c, o) {
    if (!o) { if (!c.lastLap) return 'On attend ton premier tour complet.'; return `Dernier tour en ${fmtLap(c.lastLap)}${isFinite(c.bestLap) && c.bestLap < c.lastLap - .05 ? `, ton meilleur est en ${fmtLap(c.bestLap)}` : ', c\'est ton meilleur'}. ${Brain.race.fastest.c ? `Le meilleur tour de la course : ${Brain.race.fastest.c === c ? 'c\'est toi' : Brain.race.fastest.c.drv.last + ' en ' + fmtLap(Brain.race.fastest.t)}.` : ''}`; }
    if (!c.lastLap || !o.lastLap) return `Pas encore de comparaison de rythme avec ${o.drv.last}.`;
    const d = o.lastLap - c.lastLap;
    return `${o.drv.last} a fait ${fmtLap(o.lastLap)} au dernier tour, ${Math.abs(d) < .05 ? 'le même rythme que toi' : d > 0 ? `tu es plus rapide de ${frNum(d, 1)}` : `il est plus rapide de ${frNum(-d, 1)}`}.`;
  },
  about(c, o) {
    const g = this.gapTo(c, o), ahead = o.pos < c.pos;
    let s = `${o.drv.name} est P${o.pos}`;
    if (o.dnf) return `${o.drv.name} a abandonné.`;
    s += g.lapped ? `, ${g.lapped > 0 ? 'avec ' + g.txt + ' d\'avance' : g.txt + ' derrière'}` : `, ${g.txt} ${ahead ? 'devant toi' : 'derrière toi'}`;
    s += `. Il est en ${PL[o.comp]} de ${o.age} tour${o.age > 1 ? 's' : ''}, ${o.stops} arrêt${o.stops > 1 ? 's' : ''}.`;
    if (o.pit) s += ' Il est dans les stands en ce moment.';
    else if (o.pitReq) s += ' On pense qu\'il va s\'arrêter.';
    if (c.lastLap && o.lastLap) { const d = o.lastLap - c.lastLap; s += Math.abs(d) < .1 ? ' Même rythme que toi.' : d > 0 ? ` Tu lui prends ${frNum(d, 1)} au tour.` : ` Il est plus rapide de ${frNum(-d, 1)} au tour.`; }

  /* ------------ L'INGÉNIEUR RÉPOND AU PILOTE ------------ */
  engineer(c, t0) {
    const r = Brain.race, t = this.fix(t0), g = Brain.gaps(c), left = r.laps - c.lapsDone, out = [];
    const has = re => re.test(t);
    const mate = r.cars.find(x => x.team === c.team && x !== c);
    const other = this.carNamed(t, c);
    if (has(/\b(repete|repeter|pas compris|j ai pas entendu|redis)\b/) && this.last.eng) return 'Je répète : ' + this.last.eng;
    if (other && !has(/\b(laisse|passer)\b/)) out.push(this.about(c, other));
    if (has(/\b(pneus|gomme|gommes|usure|grip|adherence|degradation|grain|graining|blister|temperature des pneus|pressions?)\b/) && !(other && has(/\b(il|lui|ses|son)\b/)) && !has(/\b(devant|derriere|celui|les autres|il a|ils ont)\b/)) {
      const w = Math.round(c.wear), k = this.mostWorn(c), h = this.worstCorner(c);
      out.push(`Tes ${PL[c.comp]} ont ${c.age} tour${c.age > 1 ? 's' : ''} et ${w} % d'usure, ils sont ${this.tyreState(w)}. Le plus usé : l'${CORNERS[k]} à ${Math.round(Math.min(100, c.wear * WEARF[k]))} %. Le plus chaud : l'${CORNERS[h]} à ${Math.round(c.temps[h])} degrés.` + (c.temps[h] > 112 ? ' Il surchauffe, ménage-le dans les virages lents.' : c.temps[h] < 75 ? ' Ils sont froids, chauffe-les.' : ''));
      if (!has(/\b(box|fenetre|strat)/)) out.push(this.pitWindow(c));
    }
    if (has(/\b(pneus|gomme|gommes|sur quoi|chausse)\b/) && has(/\b(devant|derriere|autres|celui|tete|leader)\b/)) {
      const list = [g.a, g.b].filter(Boolean).map(o => `${o.drv.last} en ${PL[o.comp]} de ${o.age} tours`);
      if (list.length) out.push(list.join(', ') + '.');
    }
    if (has(/\b(ecart|gap|intervalle|devant|derriere|distance|loin|combien.*(seconde|retard|avance))\b/) && !other) {
      let s = g.a && g.ga != null ? `${g.a.drv.last} est devant à ${this.f1(g.ga)} seconde${this.s(g.ga)}` : 'Tu es en tête de la course';
      s += g.b && g.gb != null ? `, ${g.b.drv.last} derrière à ${this.f1(g.gb)}.` : ', personne derrière.';
      if (g.a && g.ga != null && c.lastLap && g.a.lastLap) { const d = g.a.lastLap - c.lastLap; if (d > .05 && g.ga > .5) s += ` Tu reprends ${frNum(d, 1)} par tour, tu seras sur lui dans ${Math.ceil(g.ga / d)} tours.`; }
      if (g.b && g.gb != null && g.gb < 1) s += ` Il est à moins d'une seconde, attention dans les zones de freinage.`;

    if (has(/\b(position|place|classement|quel rang|je suis ou|je suis combien|ma position)\b/)) out.push(`Tu es P${c.pos} sur ${r.cars.filter(x => !x.dnf).length}.` + (c.pos === 1 ? ' En tête !' : c.pos <= 3 ? ' Sur le podium.' : c.pos <= 10 ? ' Dans les points.' : ` Le dixième est ${r.order[9] ? r.order[9].drv.last : ''}, il faut remonter.`));
    if (has(/\b(tours?|reste|restant|fin de course|combien de temps|c est bientot fini)\b/) && !has(/\b(dernier tour|meilleur tour|chrono|temps au tour)\b/)) out.push(left <= 1 ? 'C\'est le dernier tour, donne tout !' : `Il reste ${left} tours sur ${r.laps}.`);
    if (has(/\b(strategie|strat|plan|fenetre|quand.*(rentre|arret|box)|prochain arret|un ou deux arrets|combien d arrets|(dois|faut|devrait).*(rentrer|rentre|box|arreter|stands))\b/)) out.push(this.pitWindow(c));
    if (has(/\b(meteo|pluie|pleut|pleuvoir|mouille|mouillee|averse|nuage|ciel|orage|seche)\b/)) out.push(this.forecast());
    if (has(/\b(chrono|temps au tour|dernier tour|meilleur tour|rythme|lap|tour rapide|je suis rapide|je suis lent)\b/)) out.push(this.pace(c, other && has(/\b(lui|il|son|compar)/) ? other : null));
    if (has(/\b(essence|carburant|fuel|consommation)\b/)) out.push(`Il te reste ${frNum(c.fuel, 1)} kilos d'essence, c'est suffisant jusqu'à l'arrivée${c.fuel < r.fuelLap * left * .97 ? ', mais lève un peu le pied en fin de ligne droite' : ''}.`);
    if (has(/\b(batterie|ers|energie|deploiement|recharge|hybride|mode depassement|overtake)\b/)) out.push(`Batterie à ${Math.round(c.bat)} %. ${c.bat < 30 ? 'Recharge au freinage pendant un tour avant d\'attaquer.' : 'Tu peux l\'utiliser dans la ligne droite principale pour attaquer.'}`);
    if (has(/\b(coequipier|equipier|mon partenaire)\b/) && mate) out.push(this.about(c, mate));
    if (has(/\b(qui (est|mene)|en tete|leader|qui gagne|premier)\b/) && !has(/\bje suis\b/)) { const l = r.order[0]; out.push(l === c ? 'C\'est toi qui mènes !' : `${l.drv.name} mène la course, à ${this.f1(c.gap)} seconde${this.s(c.gap)} de toi.`); }
    if (has(/\b(qui s est arrete|arrets? des autres|qui a change|qui est rentre|qui a pitte)\b/)) { const p = r.order.filter(x => x.stops > 0 && x !== c).slice(0, 4); out.push(p.length ? `Déjà arrêtés : ${p.map(x => x.drv.last + ' (' + PL[x.comp] + ')').join(', ')}.` : 'Personne ne s\'est encore arrêté.'); }

      out.push(`P${c.pos}, ${left} tours à faire. ${g.a && g.ga != null ? 'Devant : ' + g.a.drv.last + ' à ' + this.f1(g.ga) + '. ' : ''}${g.b && g.gb != null ? 'Derrière : ' + g.b.drv.last + ' à ' + this.f1(g.gb) + '. ' : ''}${this.pitWindow(c)}`);

    if (has(/\b(salut|bonjour|bonsoir|coucou|hello)\b/)) out.push(this.r(['Salut ! On est là, je t\'écoute.', 'Bien reçu, la radio est bonne.']));
    if (has(/\b(ca va|tu vas bien|comment tu vas)\b/) && !out.length) out.push(this.r(['Ça va très bien ici, tout le garage est derrière toi !', 'Tout va bien au mur des stands. Concentre-toi, tu fais du bon travail.']));
    if (has(/\b(yes|youpi|trop bien|genial|incroyable|victoire|on l a fait|allez)\b/) && !out.length) out.push(this.r(['Superbe ! Continue comme ça !', 'Magnifique, garde la tête froide.', 'Yes ! Allez, allez !']));

  },

  /* ------------ LE PILOTE RÉPOND À L'INGÉNIEUR ------------ */
  driver(c, t0) {
    const r = Brain.race, t = this.fix(t0), g = Brain.gaps(c), out = [], left = r.laps - c.lapsDone;

      else if (!isWetTyre(c.comp) && r.w > .3) out.push('Aucune adhérence avec ces slicks, c\'est une patinoire !');

    if (has(/\b(batterie|ers|energie|recharge)\b/)) out.push(`La batterie est à ${Math.round(c.bat)} %, ${c.bat < 30 ? 'je dois recharger.' : 'j\'ai de quoi attaquer.'}`);
    if (has(/\b(essence|carburant|fuel)\b/)) out.push('L\'essence, c\'est votre boulot ! Dites-moi si je dois économiser.');
    if (has(/\b(meteo|pluie|pleut|mouille|piste|averse|ciel)\b/)) out.push(r.w > .5 ? 'Ça tombe fort, la visibilité est mauvaise.' : r.w > .15 ? 'Quelques gouttes, la piste est piégeuse par endroits.' : r.rain > 0 ? 'Je sens quelques gouttes sur la visière.' : this.r(['Sec pour l\'instant, ciel correct.', 'Piste sèche, adhérence correcte.']));

      else if (has(/\b(attention|surveille|derriere|revient|menace)\b/)) out.push(ahead ? `Je le vois devant, je pousse.` : `Compris, je surveille ${other.drv.last} dans les rétros.`);

    if (has(/\b(merci|ok|okay|compris|recu|copy|d accord)\b/) && !out.length) out.push(this.r(['Reçu.', 'Copy.', 'Compris.']));

    const txt = [...new Set(out)].slice(0, 2).join(' ');

  },
};

/* =====================================================================
   MULTIJOUEUR — un pilote + un ingénieur
   La simulation tourne sur l'appareil du PILOTE (hôte) ; l'ingénieur reçoit
   l'état de la course et envoie ses messages radio.
   Transport : salle temps réel de la page publiée sur claude.ai, sinon
   pair-à-pair (PeerJS) quand le fichier est hébergé ailleurs.
   ===================================================================== */
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); }); }
const NET_TOPICS = ['hello', 'cfg', 'go', 'start', 'p', 's', 'radio', 'say', 'ans', 'end', 'bye'];
const Net = {
  kind: null, code: null, owner: false, h: {}, partner: false, room: null, mq: null, bc: null,
  set(t, fn) { this.h[t] = fn; },
  fire(t, d) { const f = this.h[t]; if (f) try { f(d); } catch (e) { console.error(e); } },
  async open(code, owner) {
    this.close(); this.code = code.toUpperCase(); this.owner = owner; this.partner = false;
    if (new URLSearchParams(location.search).get('net') === 'local') return this.openBC();
    let room = null;
    try { if (window.claude && window.claude.use) room = await window.claude.use('room'); } catch (e) { room = null; }
    if (room) return this.openRoom(room);
    return this.openMqtt();
  },
  async openRoom(room) {
    this.kind = 'room';
    const r = this.room = await room.join('pf1-' + this.code.toLowerCase());
    for (const t of NET_TOPICS) r.on(t, msg => { if (!msg.sameTab) this.fire(t, msg.data); }, e => { if (e.code === 'not_granted' || e.code === 'not_permitted') toast('Connexion refusée : la page doit être partagée avec ton ami (accès Contributeur ou plus).', 6000); });
    r.onPeers(ch => this.setPartner(ch.peers.some(p => !p.sameTab)));
    return true;
  },
  openBC() { // test local : deux onglets du même navigateur (?net=local)
    this.kind = 'local';
    const bc = this.bc = new BroadcastChannel('pf1-' + this.code);
    bc.onmessage = e => { const { t, d, hi } = e.data; if (hi) { this.setPartner(true); if (hi === 1) bc.postMessage({ hi: 2 }); return; } this.fire(t, d); };
    bc.postMessage({ hi: 1 });
    return true;
  },
  // Relais via un serveur MQTT public (WebSocket sécurisé) : marche quel que soit le réseau (box, 4G/5G)
  async openMqtt() {
    this.kind = 'mqtt';
    if (!window.mqtt) await loadScript('https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js');
    const q = new URLSearchParams(location.search).get('mqtt');
    const brokers = q ? [q] : ['wss://broker.hivemq.com:8884/mqtt', 'wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
    this.me = Math.random().toString(36).slice(2, 10);
    this.base = 'paddockf1/v2/' + this.code.toLowerCase() + '/';
    for (const url of brokers) {
      try {
        this.mq = await new Promise((res, rej) => {
          const c = mqtt.connect(url, { clientId: 'pf1-' + this.me, clean: true, connectTimeout: 7000, reconnectPeriod: 2000, keepalive: 20 });
          const t = setTimeout(() => { c.end(true); rej(new Error('timeout')); }, 8000);
          c.once('connect', () => { clearTimeout(t); res(c); });
          c.once('error', e => { clearTimeout(t); c.end(true); rej(e); });
        });
        this.broker = url; break;
      } catch (e) { this.mq = null; }
    }
    if (!this.mq) throw new Error('Impossible de joindre le serveur de jeu. Vérifie ta connexion Internet puis réessaie.');
    this.mq.subscribe(this.base + '#', { qos: 0 });
    this.mq.on('message', (topic, payload) => {
      let m; try { m = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!m || m.f === this.me) return;
      this.lastSeen = Date.now(); this.setPartner(true);
      const t = topic.slice(this.base.length);
      if (t === 'hb') { if (m.d && m.d.q) this.send('hb', {}); return; }
      this.fire(t, m.d);
    });
    this.hb = setInterval(() => { this.send('hb', {}); if (this.partner && Date.now() - (this.lastSeen || 0) > 10000) this.setPartner(false); }, 3000);
    this.send('hb', { q: 1 });
    return true;
  },
  setPartner(v) { if (this.partner === v) return; this.partner = v; this.fire('__partner', v); },
  send(t, d) {
    try {
      if (this.kind === 'room' && this.room) this.room.emit(t, d).catch(() => { });
      else if (this.kind === 'mqtt' && this.mq) this.mq.publish(this.base + t, JSON.stringify({ f: this.me, d }), { qos: 0 });
      else if (this.kind === 'local' && this.bc) this.bc.postMessage({ t, d });
    } catch (e) { }
  },
  close() {
    try { if (this.room) this.room.leave(); if (this.mq) this.mq.end(true); if (this.bc) this.bc.close(); } catch (e) { }
    clearInterval(this.hb);
    Object.assign(this, { kind: null, room: null, mq: null, bc: null, partner: false, h: {} });
  },
  label() { return this.kind === 'room' ? 'salle temps réel de la page' : this.kind === 'mqtt' ? 'serveur relais en ligne' : this.kind === 'local' ? 'test local' : '—'; },
};

const CK = ['S', 'M', 'H', 'I', 'W'], MODES = ['normal', 'push', 'save', 'defend'];
const R1 = x => Math.round(x * 10), R3 = x => Math.round(x * 1000);
function serMsg(m) { return { who: m.who, code: m.car ? m.car.code : null, text: String(m.text).slice(0, 400), lbl: m.lbl || null, ask: m.ask || null, speak: m.speak, vr: m.vr || null }; }

/* ---- Hôte : appareil du pilote ---- */
const Host = {
  tP: 0, tS: 0,
  begin() {
    const r = Game.race, wk = Game.wk;
    this.payload = { gp: wk.gp, team: wk.team, drv: wk.drv, laps: r.laps, realLaps: r.realLaps, ws: r.wearScale, weather: wk.weather, grid: r.cars.map(c => c.code), comp: Object.fromEntries(r.cars.map(c => [c.code, c.comp])), twoComp: r.twoComp };
    Net.send('start', this.payload);
    Radio.onPush = m => { if (!m.fromNet) Net.send('radio', serMsg(m)); };
    Net.set('hello', () => { Net.send('cfg', Game.mp.cfg); Net.send('start', this.payload); });
    Net.set('say', d => {
      const car = Game.race.cars.find(c => c.code === d.code); if (!car) return;
      Radio.push({ who: 'eng', car, text: d.text, lbl: 'Ton ingénieur', vr: 'eng', speak: car.isPlayer, fromNet: true });
      if (car.isPlayer) Brain.humanOrder(d.text, car); else Brain.handleManager(d.text, car);
    });
    Net.set('ans', d => { const car = Game.race.cars.find(c => c.code === d.code); if (car && car.ask) { Radio.push({ who: 'eng', car, text: car.ask.opts[d.k]?.say || '', lbl: 'Ton ingénieur', fromNet: true, speak: false }); Brain.answerAsk(car, d.k); } });
    this.tP = this.tS = 0;
  },
  tick(now) {
    const r = Game.race; if (!r) return;
    if (now - this.tP > (Net.kind === 'mqtt' ? 200 : 150)) {
      this.tP = now;
      const me = r.cars.find(c => c.isPlayer), team = r.cars.filter(c => c.team === r.myTeam);
      Net.send('p', {
        t: R3(r.t), ph: r.phase === 'grid' ? 0 : 1, li: r.lights, w: Math.round(r.w * 100), rn: Math.round(r.rain * 100), fl: r.flag ? 1 : 0,
        c: r.cars.map(c => [R1(c.dist), R1(c.d), R1(c.v)]),
        pl: me ? [R1(me.x), R1(me.z), R3(me.h), Math.round((me.steer || 0) * 100), me.manual ? 1 : 0] : null,
        tm: team.map(c => [Math.round(c.thr * 100), Math.round(c.brk * 100), c.gear, Math.round(c.rpm / 10), Math.round(c.bat)]),
      });
    }
    if (now - this.tS > 1000) {
      this.tS = now;
      Net.send('s', {
        c: r.cars.map(c => [CK.indexOf(c.comp), R1(c.wear), c.age, c.stops, R3(Math.max(0, c.gap)), (c.pit ? 1 : 0) | (c.pitReq ? 2 : 0) | (c.fin ? 4 : 0) | (c.dnf ? 8 : 0) | (c.hold ? 32 : 0),
          c.pitComp ? CK.indexOf(c.pitComp) : -1, MODES.indexOf(c.mode), c.lapsDone, R3(c.lastLap), isFinite(c.bestLap) ? R3(c.bestLap) : 0, [...c.used].map(k => CK.indexOf(k)).join(''), c.temps.map(Math.round), R1(c.fuel), c.pos]),
        fa: r.fastest.c ? [r.cars.indexOf(r.fastest.c), R3(r.fastest.t)] : null, done: r.done ? 1 : 0,
      });
    }
  },
  end(rows, r) {
    Net.send('end', { rows: rows.map(x => [x.c.code, x.pos, x.gapTxt, x.pts, x.pen, x.dnf ? 1 : 0, [...x.c.used].join('')]), fa: r.fastest.c ? [r.fastest.c.code, r.fastest.t] : null });
  },
};

/* ---- Ingénieur distant : course « miroir » interpolée ---- */
const Mirror = {
  create(P) {
    const T = getTrack(P.gp), r = Object.create(Race.prototype);
    Object.assign(r, {
      T, laps: P.laps, realLaps: P.realLaps, role: 'manager', session: 'race', myTeam: TEAM[P.team], myDrv: DRV[P.drv], wearScale: P.ws, weather: P.weather,
      w: 0, rain: 0, twoComp: P.twoComp, t: 0, phase: 'grid', lights: 0, flag: false, done: false, fastest: { t: Infinity, c: null }, ev: [], aiOff: 0, tmp: {}, fuelLap: 70 / P.realLaps, cpLead: [], remote: true,
    });
    r.cars = P.grid.map((code, gp) => {
      const d = DRV[code], comp = P.comp[code] || 'M';
      return { drv: d, team: d.team, code, gp, pos: gp + 1, dist: -(7 + gp * 8), d: 0, v: 0, comp, wear: 0, age: 0, stops: 0, used: new Set([comp]), mode: 'normal', pitReq: false, pitComp: null, pit: null, fin: false, dnf: false, lapsDone: 0, lastLap: 0, bestLap: Infinity, gap: 0, temps: [90, 90, 90, 90], bat: 100, thr: 0, brk: 0, gear: 1, rpm: 0, fuel: 70, trace: new Float32Array(T.N), x: 0, z: 0, y: 0, h: 0, ti: 0, isPlayer: code === P.drv, manual: code === P.drv, steer: 0, nb: [], hold: false, wTh: 65, noise: 0, pace: 1, slide: 0 };
    });
    r.order = r.cars.slice();
    r.cars.forEach(c => { c.d = (c.gp % 2 ? -1 : 1) * Math.min(2.4, T.hw - 2); const p = trackPoint(T, c.dist, c.d, {}); Object.assign(c, { x: p.x, z: p.z, y: p.y, h: p.h, ti: p.i }); });
    return r;
  },
  applyP(r, P) {
    const ts = performance.now();
    r.phase = P.ph ? 'race' : 'grid'; r.lights = P.li; r.w = P.w / 100; r.rain = P.rn / 100; r.flag = !!P.fl; r.t = P.t / 1000;
    P.c.forEach((a, k) => { const c = r.cars[k]; if (!c) return; c.nb.push({ t: ts, dist: a[0] / 10, d: a[1] / 10, v: a[2] / 10 }); if (c.nb.length > 6) c.nb.shift(); });
    const me = r.cars.find(c => c.isPlayer);
    if (P.pl && me) { const b = me.nb[me.nb.length - 1]; if (b) { b.x = P.pl[0] / 10; b.z = P.pl[1] / 10; b.h = P.pl[2] / 1000; } me.steer = P.pl[3] / 100; me.manual = !!P.pl[4]; }
    r.cars.filter(c => c.team === r.myTeam).forEach((c, k) => { const a = P.tm[k]; if (a) { c.thr = a[0] / 100; c.brk = a[1] / 100; c.gear = a[2]; c.rpm = a[3] * 10; c.bat = a[4]; } });
  },
  applyS(r, S) {
    S.c.forEach((a, k) => {
      const c = r.cars[k]; if (!c) return;
      c.comp = CK[a[0]] || c.comp; c.wear = a[1] / 10; c.age = a[2]; c.stops = a[3]; c.gap = a[4] / 1000;
      c.pit = a[5] & 1 ? (c.pit || {}) : null; c.pitReq = !!(a[5] & 2); c.fin = !!(a[5] & 4); c.dnf = !!(a[5] & 8); c.hold = !!(a[5] & 32);
      c.pitComp = a[6] >= 0 ? CK[a[6]] : null; c.mode = MODES[a[7]] || 'normal'; c.lapsDone = a[8]; c.lastLap = a[9] / 1000; c.bestLap = a[10] ? a[10] / 1000 : Infinity;
      c.used = new Set(String(a[11]).split('').map(i => CK[+i]).filter(Boolean)); c.temps = a[12]; c.fuel = a[13] / 10; c.pos = a[14];
    });
    r.order = r.cars.slice().sort((a, b) => a.pos - b.pos);
    r.fastest = S.fa ? { c: r.cars[S.fa[0]], t: S.fa[1] / 1000 } : { t: Infinity, c: null };
    r.done = !!S.done;
  },
  step(r) {
    const now = performance.now() - (Net.kind === 'mqtt' ? 330 : 220), T = r.T;
    for (const c of r.cars) {
      const nb = c.nb; if (!nb.length) continue;
      let a = nb[0], b = nb[nb.length - 1], f = 1;
      for (let k = 0; k < nb.length - 1; k++) if (nb[k].t <= now && nb[k + 1].t >= now) { a = nb[k]; b = nb[k + 1]; f = (now - a.t) / (b.t - a.t || 1); break; }
      if (now > b.t) { a = b; f = 0; }
      const jump = Math.abs(b.dist - a.dist) > 300;
      let dist = jump ? b.dist : lerp(a.dist, b.dist, f);
      if (now > nb[nb.length - 1].t) dist += c.v * Math.min(.3, (now - nb[nb.length - 1].t) / 1000);
      c.dist = dist; c.d = jump ? b.d : lerp(a.d, b.d, f); c.v = lerp(a.v, b.v, f);
      if (c.isPlayer && a.x !== undefined && b.x !== undefined && c.manual) {
        c.x = jump ? b.x : lerp(a.x, b.x, f); c.z = jump ? b.z : lerp(a.z, b.z, f); c.h = a.h + wrapA(b.h - a.h) * f;
        c.ti = nearestIdx(T, c.x, c.z, c.ti); c.y = T.py[c.ti];
      } else {
        const p = trackPoint(T, c.dist, c.d, r.tmp); c.x = p.x; c.z = p.z; c.y = p.y; c.ti = p.i;
        const dd = b.d - a.d, dt = (b.t - a.t) / 1000 || .15; c.h = p.h - Math.atan2(dd / dt, Math.max(c.v, 6));
      }
      c.trace[c.ti] = c.v;
    }
  },
};

function myRole() { const m = Game.mp; return !m.cfg ? null : (m.owner ? m.cfg.ownerRole : (m.cfg.ownerRole === 'pilot' ? 'engineer' : 'pilot')); }
function wireLobby() {
  Net.set('__partner', v => {
    if (Game.raf && Game.multi) toast(v ? 'Ton coéquipier est reconnecté.' : 'Ton coéquipier s\'est déconnecté.', 4000);
    if (Game.mp && Game.mp.owner && v) Net.send('cfg', Game.mp.cfg);
    if ($('#scr-setup').classList.contains('on') && Game.mp) renderLobby();
  });
  Net.set('hello', () => { if (Game.mp && Game.mp.owner) Net.send('cfg', Game.mp.cfg); Net.setPartner(true); });
  Net.set('cfg', cfg => { if (Game.mp && !Game.mp.owner) { Game.mp.cfg = cfg; Net.setPartner(true); if ($('#scr-setup').classList.contains('on')) renderLobby(); } });
  Net.set('go', () => { if (myRole() === 'pilot') mpWeekend(); });
  Net.set('start', P => { if (myRole() === 'engineer' && (!Game.raf || !Game.remote)) startRemote(P); });
  Net.set('p', d => { if (Game.remote && Game.race) Mirror.applyP(Game.race, d); });
  Net.set('s', d => { if (Game.remote && Game.race) Mirror.applyS(Game.race, d); });
  Net.set('radio', m => {
    if (!Game.remote || !Game.race) return;
    const car = Game.race.cars.find(c => c.code === m.code);
    let who = m.who, vr = m.vr, lbl = m.lbl, speak = m.speak;
    if (who === 'me') { who = 'drv'; vr = 'drv'; lbl = car ? car.drv.last + ' (pilote)' : 'Pilote'; speak = true; }
    Radio.push({ who, car, text: m.text, lbl, vr, speak, fromNet: true });
    if (m.ask && car) car.ask = { ...m.ask, at: Date.now() };
  });
  Net.set('end', d => { if (Game.remote) remoteResults(d); });
  Net.set('bye', () => { toast('Ton coéquipier a quitté la partie.', 4000); });
}

/* =====================================================================
   JEU — état, écrans, boucle
   ===================================================================== */
const DISTS = [
  { k: '5', n: '5 tours', f: () => 5 }, { k: '15', n: '15 %', f: L => Math.max(5, Math.round(L * .15)) }, { k: '25', n: '25 %', f: L => Math.max(6, Math.round(L * .25)) },
  { k: '50', n: '50 %', f: L => Math.round(L * .5) }, { k: '100', n: '100 %', f: L => L },

function getTrack(i) { return Game.trackCache[i] || (Game.trackCache[i] = buildTrack(TRACKS[i])); }
function applyDev() { TEAMS.forEach(t => t.gapEff = t.gap - ((Game.save && !Game.wk?.quick && Game.save.dev[t.id]) || 0)); }
function drawPreview(cv, def, col = '#fff') {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 200, h = cv.clientHeight || 140;
  cv.width = w * dpr; cv.height = h * dpr; const g = cv.getContext('2d'); g.scale(dpr, dpr);

  for (let i = 0; i < p.length; i += 2) { x0 = Math.min(x0, p[i]); x1 = Math.max(x1, p[i]); z0 = Math.min(z0, p[i + 1]); z1 = Math.max(z1, p[i + 1]); }
  const sc = Math.min((w - 16) / (x1 - x0), (h - 16) / (z1 - z0)), ox = (w - (x1 - x0) * sc) / 2, oz = (h - (z1 - z0) * sc) / 2;
  g.lineWidth = 4; g.lineJoin = 'round'; g.strokeStyle = col; g.beginPath();
  for (let i = 0; i < p.length; i += 2) { const X = ox + (p[i] - x0) * sc, Z = oz + (p[i + 1] - z0) * sc; i ? g.lineTo(X, Z) : g.moveTo(X, Z); }
  g.closePath(); g.stroke();
  g.fillStyle = '#E10600'; g.beginPath(); g.arc(ox + (p[0] - x0) * sc, oz + (p[1] - z0) * sc, 5, 0, 7); g.fill();
}

}

/* ---------------- WEEK-END : QUALIFS + PRÉPARATION ---------------- */
function makeWeather(T, laps) {
  const segs = [], p = T.info.rain;
  if (Math.random() < p) {
    const wetStart = Math.random() < .25, from = wetStart ? -1 : rand(.12, .55) * laps, len = Math.max(2, rand(.25, .55) * laps);
    segs.push({ from, to: from + len + (wetStart ? 1 : 0), r: rand(.35, 1) });
  }
  return { segs };
}
function simQuali(T, wk, playerTime) {
  const w = wk.weather.segs.some(s => s.from < 0) ? wk.weather.segs[0].r : 0;
  const ideal = idealFor(w) || 'S';
  const aiOff = wk.role === 'pilot' ? AI_LV[wk.ai].off : 0;
  return ALL_DRIVERS.map(d => {
    let t = T.T0 + d.team.gapEff + d.sk + tyrePen(ideal, w) + w * 6 + 8 * .03 + rand(-.05, .35);
    if (wk.role === 'pilot') { if (d.code === wk.drv) t = playerTime ?? Infinity; else t += aiOff; }
    return { d, t };
  }).sort((a, b) => a.t - b.t);
}
function renderWeekend() {
  const wk = Game.wk, def = TRACKS[wk.gp], T = getTrack(wk.gp), team = TEAM[wk.team];
  setTeamVars(team); applyDev();
  wk.laps = wk.laps || DISTS.find(x => x.k === wk.dist).f(def.laps);
  wk.weather = wk.weather || makeWeather(T, wk.laps);
  const mine = wk.role === 'manager' ? team.drivers : [DRV[wk.drv]];
  wk.comp = wk.comp || {};
  const wetStart = wk.weather.segs.some(s => s.from < 0);
  mine.forEach(d => { if (!wk.comp[d.code] || (wetStart !== isWetTyre(wk.comp[d.code]))) wk.comp[d.code] = wetStart ? (wk.weather.segs[0].r > .72 ? 'W' : 'I') : 'M'; });
  const rainSeg = wk.weather.segs[0];
  const fc = !rainSeg ? '☀️ Sec pendant toute la course' : rainSeg.from < 0 ? `🌧️ Départ sous la pluie (${rainSeg.r > .72 ? 'forte' : 'modérée'})` : `🌦️ Pluie probable vers le tour ${Math.max(1, Math.round(rainSeg.from))} (≈ ${Math.round(rainSeg.to - rainSeg.from)} tours)`;
  const el = $('#scr-weekend');
  el.innerHTML = `<div class="wrap">
    <div class="topbar"><button class="btn small" id="k-back">← ${wk.quick ? 'Retour' : 'Saison'}</button><h2>${def.flag} ${esc(gpName(def))}</h2><span class="chip">${esc(def.name)}</span></div>
    <div class="grid2">
      <div class="card" style="display:grid;gap:10px">
        <canvas id="k-prev" style="width:100%;height:200px"></canvas>
        <div class="muted">${(def.len / 1000).toFixed(3).replace('.', ',')} km · ${wk.laps} tours · ${T.info.street ? 'circuit urbain' : 'circuit permanent'}${T.info.night ? ' · course de nuit' : ''}</div>
        <div><b>Prévisions météo</b><br>${fc}</div>
        <div class="opt"><label>Durée</label><div class="seg" id="k-dist">${DISTS.map(x => `<button data-v="${x.k}" class="${wk.dist === x.k ? 'on' : ''}">${x.n}</button>`).join('')}</div></div>
        ${wk.role === 'pilot' ? `<div class="opt"><label>Aides</label><div class="seg" id="k-as">${ASSISTS.map((x, i) => `<button data-v="${i}" class="${wk.assist === i ? 'on' : ''}" title="${x.d}">${x.n}</button>`).join('')}</div></div>
        <div class="opt"><label>Adversaires</label><div class="seg" id="k-ai">${AI_LV.map((x, i) => `<button data-v="${i}" class="${wk.ai === i ? 'on' : ''}">${x.n}</button>`).join('')}</div></div>` : ''}
      </div>
      <div class="card" style="display:grid;gap:12px;align-content:start">
        <h3 class="kicker">Qualifications</h3>

    aiOff: wk.role === 'pilot' ? AI_LV[wk.ai].off : 0, assist: wk.assist, grid, startComp: wk.comp,

    else { const lapsDown = Math.floor((lead.dist - c.dist) / L); g = lapsDown >= 1 && !c.fin ? '+' + lapsDown + ' T' : fmtGap(Math.max(0, c.gap)); if (c.fin) g = (lapsDown >= 1 ? '+' + lapsDown + ' T' : g) + ' 🏁'; }
    const cls = (c.team === Game.team ? ' mine' : '') + (c.pit ? ' pit' : '') + (c.dnf ? ' out' : '') + (r.fastest.c === c && r.session === 'race' ? ' fl' : '');
    html += `<div class="trow${cls}" data-code="${c.code}" style="--c:${c.team.color}"><span class="p">${i + 1}</span><span class="tbar"></span><span>${c.code}</span>${full ? `<span class="nm">${esc(c.drv.last)}${c.pitReq && !c.pit ? ' · BOX' : ''}${c.mode !== 'normal' && c.team === Game.team ? ' · ' + ({ push: 'ATT', save: 'ÉCO', defend: 'DÉF' })[c.mode] : ''}</span>` : '<span></span>'}<span class="g num">${g}</span>${tyreHTML(c.comp)}</div>`;

/* --------- écrans de données --------- */
function ctxFor(cv) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h); return { g, w, h };
}
function drawMap(cv, focusCodes) {
  const { g, w, h } = ctxFor(cv); if (w < 10) return;
  const r = Game.race, T = r.T, pad = 14;
  const sc = Math.min((w - pad * 2) / (T.maxX - T.minX), (h - pad * 2) / (T.maxZ - T.minZ));
  const ox = (w - (T.maxX - T.minX) * sc) / 2, oz = (h - (T.maxZ - T.minZ) * sc) / 2;
  const X = x => ox + (x - T.minX) * sc, Z = z => oz + (z - T.minZ) * sc;
  g.lineJoin = 'round';
  for (const [lw, col] of [[Math.max(5, T.w * sc), '#3a4150'], [2, '#cfd6e2']]) { g.lineWidth = lw; g.strokeStyle = col; g.beginPath(); for (let i = 0; i <= T.N; i += 2) { const k = i % T.N; i ? g.lineTo(X(T.px[k]), Z(T.pz[k])) : g.moveTo(X(T.px[k]), Z(T.pz[k])); } g.closePath(); g.stroke(); }
  // secteurs
  ['#ff2a6a', '#2bb3ff', '#ffd400'].forEach((col, sct) => { g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); const a = Math.floor(sct * T.N / 3), b = Math.floor((sct + 1) * T.N / 3); for (let i = a; i <= b; i += 2) { const k = i % T.N; i === a ? g.moveTo(X(T.px[k]), Z(T.pz[k])) : g.lineTo(X(T.px[k]), Z(T.pz[k])); } g.stroke(); });
  g.fillStyle = '#fff'; g.fillRect(X(T.px[0]) - 3, Z(T.pz[0]) - 3, 6, 6);
  const small = w < 260;
  for (const c of r.order.slice().reverse()) {
    if (c.dnf) continue;
    const mine = focusCodes ? focusCodes.includes(c.code) : c.team === Game.team;
    g.fillStyle = c.team.color; g.strokeStyle = mine ? '#fff' : '#000'; g.lineWidth = mine ? 2.5 : 1;
    g.beginPath(); g.arc(X(c.x), Z(c.z), mine ? 6 : 4.2, 0, 7); g.fill(); g.stroke();
    if ((mine || c.pos <= 3) && !small) { g.font = '700 11px Titillium Web, sans-serif'; g.fillStyle = '#fff'; g.fillText(c.code, X(c.x) + 8, Z(c.z) + 4); }
  }
  if (r.w > .05) { g.fillStyle = `rgba(80,140,255,${r.w * .18})`; g.fillRect(0, 0, w, h); }
}
const tempCol = t => t < 70 ? '#3d7bff' : t < 82 ? '#36c2ff' : t < 105 ? '#2BD67B' : t < 115 ? '#ffb020' : '#ff2a1f';
function drawTyres(cv, cars) {
  const { g, w, h } = ctxFor(cv); if (w < 10) return;
  const n = cars.length, cw = w / n;
  cars.forEach((c, k) => {
    const x0 = k * cw, cx = x0 + cw / 2;
    g.fillStyle = c.team.color; g.fillRect(x0 + 8, 8, 4, 18);
    g.font = '900 14px Titillium Web, sans-serif'; g.fillStyle = '#fff'; g.fillText(c.drv.last.toUpperCase() + '  P' + c.pos, x0 + 18, 22);
    g.font = '600 12px Titillium Web, sans-serif'; g.fillStyle = '#8c97aa';
    g.fillText(`${COMP[c.comp].n} · ${c.age} tour${c.age > 1 ? 's' : ''} · usure ${Math.round(c.wear)} %`, x0 + 18, 38);
    const sh = Math.min(h - 70, cw * 1.25), sw = sh * .55, top = 48;
    // silhouette
    g.fillStyle = '#1b222d'; g.fillRect(cx - sw * .14, top + sh * .08, sw * .28, sh * .84);
    g.fillRect(cx - sw * .45, top + sh * .02, sw * .9, sh * .05); g.fillRect(cx - sw * .32, top + sh * .92, sw * .64, sh * .05);
    const tw = sw * .26, th = sh * .26, f = [1.04, 1.1, .96, 1.0];
    [[-1, 0], [1, 0], [-1, 1], [1, 1]].forEach(([sx, ry], q) => {
      const tx_ = cx + sx * sw * .36 - tw / 2, ty = top + (ry ? sh * .62 : sh * .1);
      const t = c.temps[q], wr = clamp(c.wear * f[q], 0, 100);
      g.fillStyle = tempCol(t); g.beginPath(); g.roundRect ? g.roundRect(tx_, ty, tw, th, 6) : g.rect(tx_, ty, tw, th); g.fill();

function drawTelem(cv, c) {

  const gx = 10, gy = 34, gw = w - 20, gh = Math.max(40, h - 112);
  g.strokeStyle = '#273041'; g.lineWidth = 1;
  for (let v = 0; v <= 350; v += 50) { const y = gy + gh - v / 350 * gh; g.beginPath(); g.moveTo(gx, y); g.lineTo(gx + gw, y); g.stroke(); }
  g.strokeStyle = c.team.color; g.lineWidth = 2; g.beginPath();
  for (let i = 0; i < T.N; i++) { const x = gx + i / T.N * gw, y = gy + gh - c.trace[i] * 3.6 / 350 * gh; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();

  bar(10, 'GAZ', c.thr, '#2BD67B'); bar(100, 'FREIN', c.brk, '#ff2a1f'); bar(190, 'BATTERIE ' + Math.round(c.bat) + ' %', c.bat / 100, '#ffd400');
  g.fillStyle = '#fff'; g.font = '900 22px Titillium Web, sans-serif';

      <div class="opts">
        <div class="opt"><label for="st-ve">Voix de l'ingénieur</label><div style="display:flex;gap:6px;min-width:0"><select id="st-ve" class="btn" style="max-width:230px">${opts(p.voiceEng)}</select><button class="btn small" id="st-vet" aria-label="Écouter">▶</button></div></div>
        <div class="opt"><label for="st-vd">Voix du pilote</label><div style="display:flex;gap:6px;min-width:0"><select id="st-vd" class="btn" style="max-width:230px">${opts(p.voiceDrv)}</select><button class="btn small" id="st-vdt" aria-label="Écouter">▶</button></div></div>
        <p class="muted" style="font-size:13px;margin:0">${vs.length ? vs.length + ' voix françaises trouvées.' : 'Aucune voix française trouvée pour l\'instant.'} Pour des voix bien plus humaines sur iPad : <b>Réglages de l'iPad → Accessibilité → Contenu énoncé → Voix → Français</b>, puis télécharge une voix « Améliorée » ou « Premium » (par exemple Thomas, Audrey ou Aurélie). Reviens ici : elle apparaît avec une ★.</p>
        <div class="opt"><label>Voix à la radio</label><div class="seg" id="st-v"><button data-v="1" class="${p.voice ? 'on' : ''}">Activées</button><button data-v="0" class="${!p.voice ? 'on' : ''}">Texte seul</button></div></div>
        <div class="opt"><label>Qualité graphique</label><div class="seg" id="st-q">${['Basse', 'Moyenne', 'Haute', 'Ultra'].map((x, i) => `<button data-v="${i}" class="${p.quality === i ? 'on' : ''}">${x}</button>`).join('')}</div></div>
        <p class="muted" style="font-size:13px;margin:0">Haute : ombres, herbe, public animé. Ultra : ombres et image plus fines, plus de décor (iPad récent ou ordinateur). Appliqué à la prochaine course.</p>
        <div class="opt"><label>Son des moteurs</label><div class="seg" id="st-s"><button data-v="1" class="${p.sound ? 'on' : ''}">Oui</button><button data-v="0" class="${!p.sound ? 'on' : ''}">Non</button></div></div>
        <div class="opt"><label>Radio des autres écuries</label><div class="seg" id="st-o"><button data-v="1" class="${p.others ? 'on' : ''}">Oui</button><button data-v="0" class="${!p.others ? 'on' : ''}">Non</button></div></div>
        <button class="btn primary" id="st-ok">Fermer</button>
      </div>`;
    $('#st-ve').onchange = e => { p.voiceEng = e.target.value; Store.savePrefs(p); };
    $('#st-vd').onchange = e => { p.voiceDrv = e.target.value; Store.savePrefs(p); };
    $('#st-vet').onclick = () => Speech.test('eng'); $('#st-vdt').onclick = () => Speech.test('drv');
    const seg = (id, fn) => $$('#' + id + ' button').forEach(b => b.onclick = () => { fn(b.dataset.v); Store.savePrefs(p); draw(); });
    seg('st-v', v => p.voice = v === '1'); seg('st-q', v => p.quality = +v);
    seg('st-s', v => { p.sound = v === '1'; if (Game.raf) { Sfx.init(); p.sound ? Sfx.engineOn() : Sfx.engineOff(); } });
    seg('st-o', v => p.others = v === '1');
    $('#st-ok').onclick = () => { $('#modal').classList.remove('on'); onClose && onClose(); };
  };
  draw();
  $('#modal').classList.add('on');
  if (Speech.ok && !Speech.voices().length) speechSynthesis.onvoiceschanged = () => { if ($('#modal').classList.contains('on') && $('#st-ve')) draw(); };
}

/* ---------------- PAUSE / FIN ---------------- */
function pauseMenu() {
  Game.paused = !Game.multi; Speech.stop();
  const r = Game.race, quali = r.session === 'quali';
  $('#modal-card').innerHTML = `<h3 style="font-size:22px;font-weight:900;font-style:italic;margin-bottom:12px">Pause</h3>
    <div style="display:grid;gap:8px">
      <button class="btn primary" id="p-res">▶ Reprendre</button>
      ${Game.multi ? '<p class="muted" style="margin:0">Course à deux : la course continue pendant ce menu.</p>' : ''}
      ${quali ? '<button class="btn" id="p-endq">Terminer la qualif</button>' : Game.remote ? '' : '<button class="btn" id="p-sim">⏩ Terminer la course (classement actuel)</button>'}
      <button class="btn" id="p-set">⚙ Réglages (voix, qualité…)</button>
      <button class="btn" id="p-voice">${Game.prefs.voice ? '🔇 Couper les voix' : '🔊 Activer les voix'}</button>
      ${true ? `<button class="btn" id="p-sound">${Game.prefs.sound ? '🔇 Couper le moteur' : '🔊 Son moteur'}</button>` : ''}
      <button class="btn" id="p-quit">✕ Quitter ${quali ? 'la qualif' : 'la course (non comptée)'}</button>
      <p class="muted" style="font-size:13px;margin:4px 0 0">Radio : ${Game.role === 'pilot' ? 'maintiens 🎙 ou la touche V et parle. Ex : « quel est l\'écart ? », « je rentre aux stands », « comment sont mes pneus ? »' : 'parle (🎙 / V) ou écris. Ex : « box, mets des durs », « pousse », « économise les pneus », « laisse passer ton coéquipier ».'}</p>
    </div>`;
  $('#modal').classList.add('on');
  const close = () => { $('#modal').classList.remove('on'); Game.paused = false; Game.last = performance.now(); };
  $('#p-res').onclick = close;
  if ($('#p-sim')) $('#p-sim').onclick = () => { close(); r.forceFinish(); };
  if ($('#p-endq')) $('#p-endq').onclick = () => { $('#modal').classList.remove('on'); endQuali(); };
  $('#p-voice').onclick = () => { Game.prefs.voice = !Game.prefs.voice; Store.savePrefs(Game.prefs); close(); };
  if ($('#p-sound')) $('#p-sound').onclick = () => { Game.prefs.sound = !Game.prefs.sound; Store.savePrefs(Game.prefs); Game.prefs.sound ? Sfx.engineOn() : Sfx.engineOff(); close(); };
  $('#p-set').onclick = () => settingsModal(() => { if (!Game.multi) Game.paused = false; Game.last = performance.now(); });
  $('#p-quit').onclick = () => { $('#modal').classList.remove('on'); Game.paused = false; stopRace(); if (Game.multi) { Net.send('bye', {}); Game.remote = Game.host = false; return renderLobby(); } if (quali) renderWeekend(); else Game.wk.quick ? renderSetup('quick') : renderHub(); };
}
function finishRace() {
  const r = Game.race, rows = r.classify(), wk = Game.wk;
  if (Game.host) Host.end(rows, r);
  stopRace();
  if (!wk.quick && Game.save) {
    const s = Game.save;
    rows.forEach(x => { s.pts[x.c.code] = (s.pts[x.c.code] || 0) + x.pts; s.tpts[x.c.team.id] = (s.tpts[x.c.team.id] || 0) + x.pts; });
    const mine = rows.filter(x => x.c.team === Game.team);
    const ourPts = mine.reduce((a, x) => a + x.pts, 0);
    s.results[s.round] = { top: rows.slice(0, 3).map(x => x.c.code), mine: mine.map(x => x.dnf ? 'Ab.' : 'P' + x.pos).join(' / ') };
    s.budget += 3 + Math.round(ourPts / 4);
    TEAMS.forEach(t => { if (t.id !== s.team || s.role === 'pilot') s.dev[t.id] = (s.dev[t.id] || 0) + rand(0, .035); });
    s.round++;
    Store.save(s);
  }
  renderResults(rows, r);
}
function renderResults(rows, r) {
  const def = TRACKS[Game.wk.gp], el = $('#scr-results');
  const pod = [rows[1], rows[0], rows[2]].filter(Boolean);
  el.innerHTML = `<div class="wrap">
    <div class="topbar"><h2>🏁 ${def.flag} ${esc(gpName(def))} — Résultats</h2></div>
    <div class="podium">${pod.map(x => `<div class="p${x.pos}" style="--c:${x.c.team.color}"><b>P${x.pos}</b>${x.c.drv.nat} ${esc(x.c.drv.name)}<br><small class="muted">${esc(x.c.team.name)}</small></div>`).join('')}</div>
    <div class="card"><table class="std"><tr><th>Pos</th><th>Pilote</th><th>Écurie</th><th class="r">Temps / écart</th><th>Pneus</th><th class="r">Pts</th></tr>
      ${rows.map(x => `<tr class="${x.c.team === Game.team ? 'me' : ''}"><td>${x.dnf ? '—' : x.pos}</td><td><span class="tbar" style="--c:${x.c.team.color}"></span> ${esc(x.c.drv.name)}${r.fastest.c === x.c ? ' <span class="chip" style="background:#5b2a8a">⏱ ' + fmtLap(r.fastest.t) + '</span>' : ''}</td><td class="muted">${esc(x.c.team.name)}</td><td class="r num">${x.gapTxt}${x.pen ? ' <small style="color:var(--warn)">(+' + x.pen + ' s pénalité)</small>' : ''}</td><td>${[...x.c.used].map(k => tyreHTML(k)).join(' ')}</td><td class="r"><b>${x.pts || ''}</b></td></tr>`).join('')}
    </table></div>
    <div class="stickybar"><button class="btn big primary" id="r-next">${Game.multi ? 'Retour au salon' : Game.wk.quick ? 'Menu principal' : 'Retour à la saison'} →</button></div></div>`;
  $('#r-next').onclick = () => { if (Game.multi && Game.mp) { Game.remote = Game.host = false; return renderLobby(); } Game.wk.quick ? renderHome() : renderHub(); };
  show('scr-results');
}

/* ---------------- ENTRÉES ---------------- */
const Input = {
  keys: {}, touch: { l: 0, r: 0, t: 0, b: 0 }, steer: 0,
  read(dt) {
    const k = this.keys, T = this.touch;
    let st = ((k.ArrowRight || k.KeyD || T.r) ? 1 : 0) - ((k.ArrowLeft || k.KeyA || T.l) ? 1 : 0);
    let thr = (k.ArrowUp || k.KeyW || T.t) ? 1 : 0, brk = (k.ArrowDown || k.KeyS || T.b) ? 1 : 0;
    const rate = st === 0 ? 7 : (Math.sign(st) !== Math.sign(this.steer) ? 6 : 2.6);
    this.steer += clamp(st - this.steer, -dt * rate, dt * rate);
    let out = { steer: this.steer, thr, brk };
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    const gp = pads && [...pads].find(p => p && p.connected);
    if (gp) {
      const ax = gp.axes[0] || 0, rt = gp.buttons[7] ? gp.buttons[7].value : 0, lt = gp.buttons[6] ? gp.buttons[6].value : 0;
      if (Math.abs(ax) > .08 || rt > .05 || lt > .05) out = { steer: Math.sign(ax) * Math.pow(Math.max(0, Math.abs(ax) - .08) / .92, 1.4), thr: Math.max(thr, rt, gp.buttons[0]?.pressed ? 1 : 0), brk: Math.max(brk, lt, gp.buttons[1]?.pressed ? 1 : 0) };
      if (gp.buttons[3]?.pressed && !this._y) cycleView(); this._y = gp.buttons[3]?.pressed;
    }
    return out;
  },
};
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  Input.keys[e.code] = true;
  if (!Game.race || !Game.raf) return;
  if (/^Arrow/.test(e.code)) e.preventDefault();
  if (e.code === 'Escape') { $('#modal').classList.contains('on') ? $('#p-res')?.click() : pauseMenu(); }
  if (e.repeat) return;
  if (e.code === 'KeyV') { const b = Game.role === 'pilot' ? $('#ck-ptt') : $('#w-ptt'); if (b && !Mic.on) b.dispatchEvent(new PointerEvent('pointerdown')); }
  if (Game.role === 'pilot') { if (e.code === 'KeyC') cycleView(); if (e.code === 'KeyB') requestBox(); if (e.code === 'KeyP') toggleAuto(); if (/^Digit[1-5]$/.test(e.code)) requestBox(CK[+e.code.slice(5) - 1]); }
  else if (/^Digit[1-4]$/.test(e.code) && !Game.multi) { const v = [1, 2, 4, 8][+e.code.slice(5) - 1]; $(`#w-speed button[data-v="${v}"]`)?.click(); }
});
window.addEventListener('keyup', e => { Input.keys[e.code] = false; if (e.code === 'KeyV' && Mic.on) Mic.stop(); });
window.addEventListener('blur', () => { Input.keys = {}; });

/* ---------------- BOUCLE PRINCIPALE ---------------- */
function frame(now) {
  Game.raf = requestAnimationFrame(frame);
  const r = Game.race, w = Game.world; if (!r || !w) return;
  const rdt = Math.min(.1, Math.max(0, (now - Game.last) / 1000)); Game.last = now;
  const pilot = Game.role === 'pilot', me = pilot ? r.cars.find(c => c.isPlayer) : null;
  if (Game.remote) { Mirror.step(r); }
  else if (!Game.paused) {
    const inp = pilot ? Input.read(rdt) : null;
    const simDt = rdt * (pilot ? 1 : Game.speed);
    const steps = Math.min(48, Math.max(1, Math.ceil(simDt / (1 / 60)))), h = simDt / steps;
    for (let i = 0; i < steps; i++) r.update(h, inp);
    for (const ev of r.ev) Brain.handle(ev);
    r.ev.length = 0;
    if (r.phase === 'race') { Game.secAcc += simDt; while (Game.secAcc >= 1) { Game.secAcc -= 1; Brain.tick(); } }
    w.tvDirector(simDt, pilot ? [me] : r.cars.filter(c => c.team === Game.team));
    if (Game.host) Host.tick(now);
    // fin de course
    if (!Game.ending && r.session === 'race' && (r.done || (pilot && me.fin))) {
      Game.ending = true;
      setTimeout(() => { if (Game.race === r) { if (!r.done) r.forceFinish(); finishRace(); } }, pilot ? 7000 : 5000);
    }
  }
  if (Game.remote) w.tvDirector(rdt, r.cars.filter(c => c.team === Game.team));
  w.sync(rdt);
  w.render(Game.views, rdt);
  engineAudio(r, w, rdt);
  if (pilot) updateDash();
  if (now - Game.uiT > 130) {
    Game.uiT = now;
    if (pilot) updateCockpit(); else { renderTower($('#tower'), true); updateWallTop(); updateMonitors(false); }
  }
}

// Son du moteur : voiture suivie par l'écran principal (embarquée = plein volume, TV/hélico = selon distance, effet Doppler)
function engineAudio(r, w, dt) {
  if (!Game.prefs.sound || !Sfx.eng) return;
  const v0 = Game.views[0], c = w.mainCar, cam = w.mainCam;
  if (!c || !cam || !v0) return Sfx.engine(0, 0, 0);
  const t = v0.spec.type, inside = t === 'onboard' || t === 'tcam' || t === 'rear' || t === 'chase';
  let vol = 1, pitch = 1, best = c;
  if (!inside) {
    let bd = 1e9; for (const [x] of w.cars) { if (x.dnf) continue; const d = Math.hypot(x.x - cam.position.x, x.z - cam.position.z); if (d < bd) { bd = d; best = x; } }
    vol = clamp(30 / (bd + 10), 0, 1) * (t === 'heli' ? .5 : 1);
    const prev = w._aud && w._aud.c === best ? w._aud.d : bd; const vr = dt > 0 ? (bd - prev) / dt : 0;
    pitch = clamp(340 / (340 + vr), .75, 1.3); w._aud = { c: best, d: bd };
  } else vol = t === 'chase' ? .7 : 1;
  const squeal = best.isPlayer ? best.slide || 0 : 0;
  Sfx.engine(best.rpm || 4000, best.thr || 0, (Game.role === 'pilot' ? 1 : .6) * vol, pitch, squeal, r.rain);
}

/* ---------------- INIT ---------------- */
(function init() {
  if (matchMedia('(pointer: coarse)').matches) document.body.classList.add('has-touch');
  if (!window.THREE) { document.body.innerHTML = '<div style="padding:30px;font:16px system-ui;color:#fff">Impossible de charger le moteur 3D (Three.js). Vérifie ta connexion Internet puis recharge la page.</div>'; return; }
  if (Speech.ok) speechSynthesis.onvoiceschanged = () => { };
  AI.init();
  document.addEventListener('pointerdown', () => Sfx.init(), { passive: true });
  renderHome();
})();
</script>
